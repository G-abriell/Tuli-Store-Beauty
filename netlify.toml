[build]
  command = "npm run build"
  publish = ".next"

# Desativa o badge automático "Powered by Netlify" injetado nos deploys de preview.
[build.environment]
  NETLIFY_BADGE = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https://images.unsplash.com https://*.supabase.co; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co https://api.resend.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; font-src 'self'; object-src 'none'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Remove/bloqueia o script do Netlify badge que é injetado automaticamente nos deploys de preview.
# Intercepta a URL do widget (netlify-badge) e retorna 204 (No Content), impedindo a injeção.
[[redirects]]
  from = "/netlify-assets/netlify-badge.js"
  to = "/?badge=blocked"
  status = 204
  force = true
